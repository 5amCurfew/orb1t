<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORB1T - Space Survival</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background-color: #02030a;
            background-image:
                radial-gradient(circle at 18% 16%, rgba(255, 255, 255, 0.18) 0 1px, transparent 1.5px),
                radial-gradient(circle at 72% 22%, rgba(174, 203, 255, 0.2) 0 1px, transparent 1.5px),
                radial-gradient(circle at 82% 74%, rgba(255, 226, 168, 0.14) 0 1px, transparent 1.5px),
                linear-gradient(180deg, #060814 0%, #090d1b 42%, #030409 100%);
            font-family: monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #game-viewport {
            position: relative;
            display: inline-block;
            background:
                radial-gradient(circle at 74% 20%, rgba(92, 114, 163, 0.35) 0, rgba(92, 114, 163, 0.35) 8%, transparent 8.5%),
                linear-gradient(180deg, rgba(9, 12, 24, 0.98) 0%, rgba(6, 8, 18, 0.92) 52%, rgba(2, 3, 8, 0.98) 100%);
            box-shadow: 0 0 0 3px #ffffff, 0 0 0 6px #0b1223;
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            color: #fff;
            font-size: 14px;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            padding: 20px;
            letter-spacing: 0.08em;
        }
        #controls {
            position: absolute;
            bottom: 0;
            left: 0;
            color: #fff;
            font-size: 12px;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
            padding: 20px;
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="hud">
        <div>ORB1T v0.1</div>
        <div id="position">Position: (0, 0, 0)</div>
        <div id="climate">Climate: Stone</div>
    </div>
    <div id="controls">
        <div>Arrow Keys: Move | W: Jump | R: Shoot | Q: Place Marker | E: Rotate Camera</div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
